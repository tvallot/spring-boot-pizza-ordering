spring.application.name=pizza-api
server.port=${PORT:8080}

# Return RFC 7807 problem details for framework errors too (404 on unknown route, 405, 415...)
spring.mvc.problemdetails.enabled=true
# Error messages are always in English, whatever the server locale
spring.web.locale=en
spring.web.locale-resolver=fixed

# JWT: set APP_JWT_SECRET (Base64, >= 256 bits) in production so tokens survive restarts
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration=1h

# Time needed to bake the pizzas of a paid order
app.kitchen.preparation-time=20s

# Extra origins allowed to call the API (only needed when the client is served from another origin)
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
